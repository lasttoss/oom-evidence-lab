<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="oom-evidence-pipeline-root" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">OOM evidence pipeline: arm before the death, classify after it</title>
  <desc id="d">Two lanes. The upper lane, armed before the incident, holds guard.sh and watch.sh. The lower lane holds collect, classify, persist and alert. An unknown alert returns through fingerprint and learn to the rule table, where a human merges it.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #oom-evidence-pipeline-root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
    --rule:rgba(45,49,66,0.12); --rule-solid:#bfc0c0; --accent:#eb6c36;
    --accent-tint:rgba(235,108,54,0.08); --link:#2e5aa8; }
      #oom-evidence-pipeline-root { font-family: Inter,system-ui,-apple-system,"Segoe UI",sans-serif; color: var(--ink); }
      #oom-evidence-pipeline-root figure { margin:0;max-width:1000px; }
      #oom-evidence-pipeline-root figcaption { margin-top:18px;font-size:13px;line-height:1.55;color:var(--muted);max-width:78ch; }
      #oom-evidence-pipeline-root .mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; }</style>
  </defs>

  <rect x="0" y="0" width="960" height="430" fill="var(--paper)"/>

  <!-- lane labels -->
  <text x="24" y="36" font-size="12" letter-spacing="0.09em" fill="var(--soft)" class="mono">BEFORE THE INCIDENT — ARM</text>
  <line x1="24" y1="48" x2="936" y2="48" stroke="var(--rule)" stroke-width="1"/>
  <text x="24" y="248" font-size="12" letter-spacing="0.09em" fill="var(--soft)" class="mono">AFTER THE DEATH — CLASSIFY</text>
  <line x1="24" y1="260" x2="936" y2="260" stroke="var(--rule)" stroke-width="1"/>

  <!-- BEFORE -->
  <g>
    <rect x="24" y="72" width="200" height="86" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="44" y="104" font-size="15" font-weight="600">guard.sh</text>
    <text x="44" y="126" font-size="12" fill="var(--muted)">dump flag → real volume</text>
    <text x="44" y="144" font-size="12" fill="var(--muted)">NMT · JFR · exit on OOM</text>
  </g>
  <g>
    <rect x="264" y="72" width="200" height="86" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="284" y="104" font-size="15" font-weight="600">watch.sh</text>
    <text x="284" y="126" font-size="12" fill="var(--muted)">histo · heap_info · cgroup</text>
    <text x="284" y="144" font-size="12" fill="var(--muted)">the only attribution for SIGKILL</text>
  </g>
  <text x="504" y="112" font-size="12" fill="var(--soft)" class="mono">if it was never armed,</text>
  <text x="504" y="130" font-size="12" fill="var(--soft)" class="mono">it cannot be recovered</text>

  <!-- BEFORE -> AFTER -->
  <line x1="364" y1="158" x2="364" y2="196" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="364,204 359,194 369,194" fill="var(--muted)"/>
  <text x="376" y="184" font-size="12" fill="var(--muted)">process dies</text>

  <!-- AFTER -->
  <g>
    <rect x="24" y="290" width="176" height="86" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="44" y="322" font-size="15" font-weight="600">collect</text>
    <text x="44" y="344" font-size="12" fill="var(--muted)">read-only, time-boxed</text>
    <text x="44" y="362" font-size="12" fill="var(--muted)">missing → says why</text>
  </g>
  <g>
    <rect x="240" y="290" width="196" height="86" rx="3" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="260" y="322" font-size="15" font-weight="600">classify</text>
    <text x="260" y="344" font-size="12" fill="var(--muted)">10 kinds, rules first</text>
    <text x="260" y="362" font-size="12" fill="var(--muted)">unknown keeps its cause</text>
  </g>
  <g>
    <rect x="476" y="290" width="196" height="86" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="496" y="322" font-size="15" font-weight="600">persist</text>
    <text x="496" y="344" font-size="12" fill="var(--muted)">bundle · index · table</text>
    <text x="496" y="362" font-size="12" fill="var(--muted)">text forever, dumps pruned</text>
  </g>
  <g>
    <rect x="712" y="290" width="200" height="86" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="732" y="322" font-size="15" font-weight="600">alert</text>
    <text x="732" y="344" font-size="12" fill="var(--muted)">13 fields · bundle path</text>
    <text x="732" y="362" font-size="12" fill="var(--muted)">attribution: can we locate it?</text>
  </g>

  <!-- arrows -->
  <line x1="200" y1="333" x2="232" y2="333" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="240,333 230,328 230,338" fill="var(--muted)"/>
  <line x1="436" y1="333" x2="468" y2="333" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="476,333 466,328 466,338" fill="var(--muted)"/>
  <line x1="672" y1="333" x2="704" y2="333" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="712,333 702,328 702,338" fill="var(--muted)"/>

  <!-- unknown loop -->
  <path d="M 812 290 L 812 232 L 338 232 L 338 290" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="338,290 333,280 343,280" fill="var(--accent)"/>
  <text x="470" y="222" font-size="11.5" fill="var(--accent)" class="mono">unknown → fingerprint → learn proposes → human merges</text>
</svg>
